[build-system]
# These are the packages required BEFORE setup.py is even executed
requires = ["setuptools>=42", "wheel", "numpy>=1.18.0"]
build-backend = "setuptools.build_meta"
[tool.cibuildwheel]
skip = ["*i686","pp*", "cp36-*", "cp37-*", "cp38-*"]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_28_aarch64"